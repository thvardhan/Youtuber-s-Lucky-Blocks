# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Run Gradle itself on Java 8 (Forge 1.16.5 / FG5). Use forward slashes. If this path differs on your PC, edit or remove.
# (Does not change Windows PATH; for a global default use your own JAVA_HOME / Path setup.)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-8.0.482.8-hotspot

# Mod identity (jar name = ${mod_id}-${mod_version}.jar; keep in sync with META-INF/mods.toml and Main.java)
mod_id=ytluckyblocks
mod_version=1.16.5-1.0.0
mod_group=thvardhan.ytluckyblocks